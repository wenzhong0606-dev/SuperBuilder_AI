name: SuperBuilder AI - .NET CI

on:
  push:
    branches:
      - master
    # 纯文档改动不触发流水线，节省 CI 资源；
    # 代码+文档混合提交仍会跑（只要有一个文件路径不在忽略列表）。
    paths-ignore:
      - 'docs/**'
      - '.workbuddy/**'
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '.workbuddy/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_SQL_PASSWORD: "SuperBuilder_C13_3!Test2026"
  CI: "true"

jobs:
  changes:
    name: 变更范围分析
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 判断是否需要重型测试
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="${GITHUB_SHA}^"
            fi
          fi

          files=$(git diff --name-only "$BASE" "$GITHUB_SHA" || true)
          printf '%s\n' "$files"

          runtime=false
          e2e=false

          if printf '%s\n' "$files" | grep -Eq '^(SuperBuilder_AI/src/Api/|SuperBuilder_AI/src/Application/(Golden|BiQuery)/|SuperBuilder_AI/src/Infrastructure/(Persistence|Llm)/|SuperBuilder_AI/src/Domain/(Golden|BiQuery)/|SuperBuilder_AI/appsettings|SuperBuilder_AI/SuperBuilder_AI\.csproj|\.github/workflows/dotnet-build\.yml)'; then
            runtime=true
          fi

          if printf '%s\n' "$files" | grep -Eq '^(SuperBuilder_AI\.Web/|SuperBuilder_AI\.Components/|SuperBuilder_AI/src/(Api|Application|Domain|Infrastructure)/|tests/SuperBuilder_AI\.E2E\.Tests/|SuperBuilder_AI/appsettings|\.github/workflows/dotnet-build\.yml)'; then
            e2e=true
          fi

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "Runtime Smoke: $runtime"
          echo "Web E2E: $e2e"

  build:
    name: 编译检查
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 输出 .NET 版本
        run: dotnet --info
      - name: 恢复 NuGet 依赖
        run: dotnet restore SuperBuilder_AI.CI.slnf -p:TargetFrameworks=net10.0
      - name: Release 编译
        run: dotnet build SuperBuilder_AI.CI.slnf --configuration Release --no-restore -p:TargetFrameworks=net10.0
      - name: 输出编译完成信息
        if: success()
        run: echo "SuperBuilder AI Release 编译通过"

  unit-tests:
    name: 单元测试 (SuperBuilder_AI.Tests)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 运行全量单元测试
        # CI-02：全量主单测 job。此前 tests/SuperBuilder_AI.Tests 不在 SuperBuilder_AI.CI.slnf 中，
        # 其 1061 个 [Fact]/[Theory] 从未在 CI 编译或执行——代码改动破坏单测无人发现。
        #
        # 关键：测试工程必须"自带完整 restore+build"（本命令即完整 dotnet test，未加 --no-restore/--no-build），
        # 且**不得**携带全局 -p:TargetFrameworks=net10.0：该全局属性会污染测试工程的 NuGet 资产关联，
        # 使 xunit.runner.visualstudio 适配器 build/*.targets 与 net10.0 错配、适配器 DLL 不进输出，
        # dotnet test 报 "No test is available" → 0 用例 → 退出码 0 → 假绿（同 e2e job 的既有注释）。
        # 因全局 env CI=true，SuperBuilder_AI.Components 只产 net10.0（见其 csproj），
        # 故 ProjectReference → Components 不会要求 android/ios workload。
        # 测试为纯内存 SQLite（Microsoft.EntityFrameworkCore.Sqlite），不依赖 SQL Server / Qdrant 容器。
        # 执行数取自 trx 的 <Counters total=…>（机器生成、唯一），而非 console 摘要文本——
        # console 文本里的 "Total" 会与 run 脚本回显及测试自身输出混淆，解析值不可信。
        run: |
          set -o pipefail
          dotnet test tests/SuperBuilder_AI.Tests/SuperBuilder_AI.Tests.csproj \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory "$GITHUB_WORKSPACE/TestResults" 2>&1 | tee unit-tests.log
          test_exit=$?
          trx="$GITHUB_WORKSPACE/TestResults/unit-tests.trx"
          # 先截出 <Counters …> 标签本身，再逐属性提取——避免贪婪匹配把相邻属性数字一并带入
          counters=$(grep -oE '<Counters[^>]*>' "$trx" | head -1)
          total=$(printf '%s\n' "$counters" | grep -oE '\btotal="[0-9]+"' | grep -oE '[0-9]+')
          executed=$(printf '%s\n' "$counters" | grep -oE '\bexecuted="[0-9]+"' | grep -oE '[0-9]+')
          passed=$(printf '%s\n' "$counters" | grep -oE '\bpassed="[0-9]+"' | grep -oE '[0-9]+')
          failed=$(printf '%s\n' "$counters" | grep -oE '\bfailed="[0-9]+"' | grep -oE '[0-9]+')
          echo "trx 计数：total=${total:-0} executed=${executed:-0} passed=${passed:-0} failed=${failed:-0}"
          if [ "${total:-0}" -eq 0 ]; then
            echo "::error::单元测试 total=0，疑似 0 用例（xunit 适配器未部署/工程未构建）——按失败处理，防止假绿。"
            exit 1
          fi
          exit $test_exit
      - name: 上传单元测试日志与结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: |
            unit-tests.log
            TestResults/
          if-no-files-found: ignore

  controller-runtime:
    name: V2.6 Evaluation Controller Runtime Smoke
    needs: [changes, build]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 恢复 Runtime NuGet 依赖
        run: dotnet restore SuperBuilder_AI.CI.slnf -p:TargetFrameworks=net10.0
      - name: 启动 SQL Server CI 容器
        run: |
          docker run -d --name superbuilder-c13-3-sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="${TEST_SQL_PASSWORD}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: 启动 Qdrant CI 容器
        run: |
          docker run -d --name superbuilder-c13-3-qdrant \
            -p 6333:6333 \
            -p 6334:6334 \
            qdrant/qdrant:v1.19.0
      - name: 等待 SQL Server 协议级 Ready
        run: |
          for i in {1..60}; do
            if docker exec superbuilder-c13-3-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "${TEST_SQL_PASSWORD}" -Q "SELECT 1" \
              -b -o /tmp/sqlserver-ready.txt >/dev/null 2>&1; then
              echo "SQL Server 已完成协议级 Ready，并通过 sa 身份认证"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server 未能在限定时间内完成协议级 Ready"
          docker exec superbuilder-c13-3-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "${TEST_SQL_PASSWORD}" -Q "SELECT 1" -b || true
          docker logs superbuilder-c13-3-sqlserver
          exit 1
      - name: 等待 Qdrant 协议级 Ready
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null 2>&1; then
              echo "Qdrant HTTP 6333 已 Ready"
              exit 0
            fi
            sleep 2
          done
          docker logs superbuilder-c13-3-qdrant
          exit 1
      - name: 安装 EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: 初始化 CI Metadata 数据库
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SuperBuilder_C13_3;User Id=sa;Password=${{ env.TEST_SQL_PASSWORD }};TrustServerCertificate=True;"
        run: |
          dotnet ef database update --project SuperBuilder_AI/SuperBuilder_AI.csproj --startup-project SuperBuilder_AI/SuperBuilder_AI.csproj --configuration Release
      - name: Release 编译 Runtime 应用
        run: dotnet build SuperBuilder_AI.CI.slnf --configuration Release --no-restore -p:TargetFrameworks=net10.0
      - name: 启动 Web API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SuperBuilder_C13_3;User Id=sa;Password=${{ env.TEST_SQL_PASSWORD }};TrustServerCertificate=True;"
          Qdrant__Host: 127.0.0.1
          Qdrant__Port: 6334
          # V2.6 修复：/api/metadata-vector/rebuild 受 DiagnosticsAccessPolicy 保护，需 platform:diagnostics:manage。
          # CI 此前匿名调用返回 401。经 PlatformBootstrap 配置落地一名平台管理员（幂等），
          # 供本 job 登录后持令牌调用该管理端点。仅 CI 测试环境使用。
          PlatformBootstrap__Username: "ci-platform-admin"
          PlatformBootstrap__Password: "C13_3_CI_Admin_Pass_2026"
          # SEC-01：CI 测试密钥（AES-256）。生产环境须由 KeyVault/环境变量注入真实主密钥，缺失即 fail-fast。
          SecretStore__MasterKey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          dotnet run --project SuperBuilder_AI/SuperBuilder_AI.csproj --configuration Release --no-restore --no-build --urls http://127.0.0.1:5050 > /tmp/superbuilder-api.log 2>&1 &
          echo $! > /tmp/superbuilder-api.pid
      - name: 等待 Controller 启动
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/serialization-roundtrip > /tmp/serialization.json; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/superbuilder-api.log
          exit 1
      - name: 导入 C.13.3 Metadata CSV Fixture
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/metadata-fixture/import | tee /tmp/metadata-fixture.json
          grep -q '"passed":true' /tmp/metadata-fixture.json
      - name: 获取平台管理员令牌（platform:diagnostics:manage）
        run: |
          # platform 租户在全新 CI 库由 IdentityService 种子首位创建；经 SQL 容器直接读取 Id，避免硬编码。
          TID=$(docker exec superbuilder-c13-3-sqlserver /opt/mssql-tools18/bin/sqlcmd \
            -C -S localhost -U sa -P "${{ env.TEST_SQL_PASSWORD }}" \
            -d SuperBuilder_C13_3 -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT Id FROM dbo.Tenants WHERE TenantCode='platform'" \
            | tr -d '[:space:]' | grep -E '^[0-9]+$')
          echo "Platform tenant id = $TID"
          [ -n "$TID" ] || { echo "::error::未能解析 platform 租户 ID"; exit 1; }

          LOGIN_BODY=$(jq -n --arg u "ci-platform-admin" --argjson t "$TID" --arg p "C13_3_CI_Admin_Pass_2026" \
            '{username:$u, tenantId:$t, password:$p}')
          TOKEN=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5050/api/auth/login \
            -H 'Content-Type: application/json' -d "$LOGIN_BODY" | jq -r '.token')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::平台管理员登录失败，未获取到令牌"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "CI_PLATFORM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: 通过现有 Controller 重建 Metadata Vector（持令牌）
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer ${{ env.CI_PLATFORM_TOKEN }}" \
            http://127.0.0.1:5050/api/metadata-vector/rebuild | tee /tmp/metadata-rebuild.json
          grep -q '"success":true' /tmp/metadata-rebuild.json
          test "$(jq '.tableCount' /tmp/metadata-rebuild.json)" -gt 0
          test "$(jq '.columnVectorCount' /tmp/metadata-rebuild.json)" -gt 0
          test "$(jq '.semanticVectorCount' /tmp/metadata-rebuild.json)" -gt 0
      - name: Controller Serialization Contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/serialization-roundtrip | tee /tmp/serialization.json
          grep -q '"passed":true' /tmp/serialization.json
      - name: Controller Three-State Contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/three-state | tee /tmp/three-state.json
          grep -q '"missingMetricsIsNull":true' /tmp/three-state.json
          grep -q '"emptyMetricsIsNotNull":true' /tmp/three-state.json
      - name: Controller Golden Dataset Contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/golden-dataset | tee /tmp/golden-dataset.json
          grep -q '"passed":true' /tmp/golden-dataset.json
      - name: Controller C.13.3 Multi-Metric Evaluation
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:5050/evaluation/diagnostics/query-plan-evaluation?caseId=GQ-007" | tee /tmp/gq007.json
          test "$(jq -r '.passed' /tmp/gq007.json)" = "true"
          test "$(jq '.evaluation.metrics.details | length' /tmp/gq007.json)" -eq 2
          test "$(jq -r '.evaluation.metrics.details[0].semanticText' /tmp/gq007.json)" = "入库数量"
          test "$(jq -r '.evaluation.metrics.details[1].semanticText' /tmp/gq007.json)" = "入库单数量"
          test "$(jq '.runtimePlan.metrics | length' /tmp/gq007.json)" -eq 2
      - name: Controller Golden Coverage
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/golden-dataset-coverage | tee /tmp/golden-coverage.json
          test "$(jq '.missingDimensions | length' /tmp/golden-coverage.json)" -eq 0
      - name: Controller Golden Quality
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/golden-dataset-quality | tee /tmp/golden-quality.json
          grep -q '"passed":true' /tmp/golden-quality.json
      - name: Controller Golden Release Gate
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5050/evaluation/diagnostics/golden-dataset-release-gate | tee /tmp/golden-release-gate.json
          grep -q '"passed":true' /tmp/golden-release-gate.json
      - name: 输出 API 日志
        if: always()
        run: cat /tmp/superbuilder-api.log || true
      - name: 输出容器日志
        if: always()
        run: |
          docker logs superbuilder-c13-3-sqlserver || true
          docker logs superbuilder-c13-3-qdrant || true
      - name: 清理 CI 容器
        if: always()
        run: |
          docker rm -f superbuilder-c13-3-sqlserver superbuilder-c13-3-qdrant || true
          if [ -f /tmp/superbuilder-api.pid ]; then kill $(cat /tmp/superbuilder-api.pid) || true; fi

  e2e:
    name: Web/Blazor E2E (Playwright)
    needs: [changes, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 设置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 恢复 NuGet 依赖
        run: dotnet restore SuperBuilder_AI.CI.slnf -p:TargetFrameworks=net10.0
      - name: Release 编译（含 E2E 工程）
        run: dotnet build SuperBuilder_AI.CI.slnf --configuration Release --no-restore -p:TargetFrameworks=net10.0
      - name: 加全局工具到 PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: 启动 SQL Server CI 容器
        run: |
          docker run -d --name superbuilder-e2e-sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="${TEST_SQL_PASSWORD}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
      - name: 启动 Qdrant CI 容器
        run: |
          docker run -d --name superbuilder-e2e-qdrant \
            -p 6333:6333 \
            -p 6334:6334 \
            qdrant/qdrant:v1.19.0
      - name: 等待 SQL Server Ready
        run: |
          for i in $(seq 1 60); do
            if docker exec superbuilder-e2e-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -C -S localhost -U sa -P "${TEST_SQL_PASSWORD}" -Q "SELECT 1" -b -o /dev/null >/dev/null 2>&1; then
              echo "SQL Server Ready"; exit 0
            fi
            sleep 2
          done
          docker logs superbuilder-e2e-sqlserver; exit 1
      - name: 等待 Qdrant Ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null 2>&1; then
              echo "Qdrant Ready"; exit 0
            fi
            sleep 2
          done
          docker logs superbuilder-e2e-qdrant; exit 1
      - name: 安装 EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: 初始化 CI 元数据库
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SuperBuilder_C13_3;User Id=sa;Password=${{ env.TEST_SQL_PASSWORD }};TrustServerCertificate=True;"
        run: dotnet ef database update --project SuperBuilder_AI/SuperBuilder_AI.csproj --startup-project SuperBuilder_AI/SuperBuilder_AI.csproj --configuration Release
      - name: 启动 Web API (5050)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SuperBuilder_C13_3;User Id=sa;Password=${{ env.TEST_SQL_PASSWORD }};TrustServerCertificate=True;"
          Qdrant__Host: 127.0.0.1
          Qdrant__Port: 6334
          ASPNETCORE_URLS: http://127.0.0.1:5050
          # M12-P0：触发 API 启动序列中的 E2E 沙箱种子（创建 e2eapp 租户 + e2eadmin/e2ereader 账号）。
          E2E_SEED: "true"
          # 限流：本地 gitignored appsettings.Local.json（LoginLimit=500/GlobalLimit=1000）在 CI 不存在，
          # 回退默认值 LoginLimit=10/60s 会因所有 E2E 登录同源自 127.0.0.1 共用一个限流桶而 429，
          # 导致权限矩阵大部分用例登录即被限流失败。此处用环境变量注入等价的高阈值（仅 CI 测试环境）。
          RateLimit__LoginLimit: "500"
          RateLimit__GlobalLimit: "1000"
          # SEC-01：与 build job 一致的 CI 测试主密钥（AES-256）。此前 e2e job 的 API 未注入此键，
          # 导致 ISecretStore 单例构造失败——E2E 种子创建数据源（需 Protect）降级、涉及加解密的端点
          # 在请求期抛 "缺少 SecretStore:MasterKey"。注入后与 build job 行为一致，DataSourceScan/RlsIsolation
          # 等数据源头相关用例才能真正落到有数据的状态（而非空库 0=0 假通过）。
          SecretStore__MasterKey: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: |
          dotnet run --project SuperBuilder_AI/SuperBuilder_AI.csproj --configuration Release --no-restore --no-build --urls http://127.0.0.1:5050 > /tmp/sb-api.log 2>&1 &
          echo $! > /tmp/sb-api.pid
      - name: 启动 Web (Blazor Server, 5080)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=SuperBuilder_C13_3;User Id=sa;Password=${{ env.TEST_SQL_PASSWORD }};TrustServerCertificate=True;"
          ApiBaseUrl: http://127.0.0.1:5050
          ASPNETCORE_URLS: http://127.0.0.1:5080
        run: |
          dotnet run --project SuperBuilder_AI.Web/SuperBuilder_AI.Web.csproj --configuration Release --no-restore --no-build --urls http://127.0.0.1:5080 > /tmp/sb-web.log 2>&1 &
          echo $! > /tmp/sb-web.pid
      - name: 等待 Web 就绪
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:5080/ >/dev/null 2>&1; then
              echo "Web Ready"; exit 0
            fi
            sleep 2
          done
          cat /tmp/sb-web.log; exit 1
      - name: 安装 Playwright CLI 与 Chromium
        # Microsoft.Playwright.CLI 已废弃（最新 1.2.3，不随 Microsoft.Playwright 版本走）；
        # .NET 绑定 Microsoft.Playwright 1.50.0 对应 Playwright 1.50.0，用匹配的 npm 包安装浏览器最可靠。
        run: npx -y playwright@1.50.0 install --with-deps chromium
      - name: 运行 E2E 业务链测试（M13-09 全量接入 CI）
        env:
          # 账号由 API 的 E2E_SEED 种子创建，凭据与 E2ESandboxSeedService 硬编码一致；
          # 租户 id 由测试经 tenant-by-code 按编码 e2eapp 解析，故无需 SB_E2E_TENANT。
          SB_E2E_BASE_URL: http://127.0.0.1:5080
          SB_E2E_API_URL: http://127.0.0.1:5050
          SB_E2E_USER: e2eadmin
          SB_E2E_PASSWORD: longping00
          SB_E2E_READER_USER: e2ereader
          SB_E2E_READER_PASSWORD: longping00
        # 关键：测试工程必须"自带完整 restore+build"而非复用 slnf 的 --no-restore。
        # slnf 的 restore/build 携带全局 -p:TargetFrameworks=net10.0（规避 Components 的
        # android/ios workload），会使该全局属性传入测试工程的 NuGet 资产关联，导致
        # xunit.runner.visualstudio 适配器 build/*.targets 与 net10.0 错配、适配器 DLL
        # 不进输出，dotnet test 报"No test is available"（0 用例→退出码 0→假绿）。
        # 此处对测试工程单独 dotnet test（自带 restore+build、不加该属性）：测试工程
        # 仅引用 NuGet 包、无 ProjectReference，不会触发 android/ios，且 xunit 适配器
        # 正常部署、可被 VSTest 发现。
        # 过滤器边界（M13-09 全量接入）：`FullyQualifiedName~E2ETests` 选中全部"业务链 E2E"
        # 功能类（PlatformLogin / AppRuntime / DataSourceScan / DashboardRender /
        # RlsIsolation / PermissionMatrix），天然排除辅助类（VisualBaseline / Accessibility /
        # AuthFlow / LanguageSwitch / PermissionDeny）——后者命名不含 "E2E"，且部分依赖 CI
        # 未设的 SB_E2E_TENANT/READER_TENANT 会诚实跳过；DataSourceScan 还需
        # SB_E2E_SCAN_CONNECTION 才真实执行（CI 未设→诚实跳过，不假绿）。
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/E2EResults"
          dotnet test tests/SuperBuilder_AI.E2E.Tests/SuperBuilder_AI.E2E.Tests.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~E2ETests" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=e2e-tests.trx" \
            --results-directory "$GITHUB_WORKSPACE/E2EResults" 2>&1 | tee e2e-tests.log
          test_exit=$?

          trx="$GITHUB_WORKSPACE/E2EResults/e2e-tests.trx"
          if [ ! -f "$trx" ]; then
            echo "::error::E2E 未生成 TRX 结果，拒绝假绿。"
            exit 1
          fi

          counters=$(grep -oE '<Counters[^>]*>' "$trx" | head -1)
          total=$(printf '%s\n' "$counters" | grep -oE '\btotal="[0-9]+"' | grep -oE '[0-9]+' || true)
          executed=$(printf '%s\n' "$counters" | grep -oE '\bexecuted="[0-9]+"' | grep -oE '[0-9]+' || true)
          passed=$(printf '%s\n' "$counters" | grep -oE '\bpassed="[0-9]+"' | grep -oE '[0-9]+' || true)
          failed=$(printf '%s\n' "$counters" | grep -oE '\bfailed="[0-9]+"' | grep -oE '[0-9]+' || true)

          echo "E2E trx：total=${total:-0} executed=${executed:-0} passed=${passed:-0} failed=${failed:-0}"

          if [ "${total:-0}" -eq 0 ] || [ "${executed:-0}" -eq 0 ] || [ "${passed:-0}" -eq 0 ]; then
            echo "::error::E2E 没有真实执行并通过任何用例（可能全部 Skip / 浏览器未启动），拒绝假绿。"
            exit 1
          fi

          exit $test_exit
      - name: 上传视觉基线产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-baselines
          path: |
            tests/SuperBuilder_AI.E2E.Tests/artifacts/visual-baselines/
            e2e-tests.log
            E2EResults/
          if-no-files-found: ignore
      - name: 输出服务日志
        if: always()
        run: |
          cat /tmp/sb-api.log || true
          cat /tmp/sb-web.log || true
      - name: 清理
        if: always()
        run: |
          docker rm -f superbuilder-e2e-sqlserver superbuilder-e2e-qdrant || true
          [ -f /tmp/sb-api.pid ] && kill "$(cat /tmp/sb-api.pid)" || true
          [ -f /tmp/sb-web.pid ] && kill "$(cat /tmp/sb-web.pid)" || true
