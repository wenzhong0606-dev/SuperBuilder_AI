name: Golden Regression Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  golden-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Golden Regression Tests
        run: dotnet test SuperBulider_AI.Tests/SuperBulider_AI.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"
